name: Rebased observation (temporary)

# Temporary observation harness for branch port/arm64-rebased. Its first
# revision (8e7e82d0) ran the full `cargo test -p solidcraft-engine
# robustness_goldens` on Linux x86_64 and aarch64 (run 39152103110; logs
# committed under docs/ports/rebased-*.txt). This revision keeps only the
# observation pass, made resilient to the mismatch it expects (bash -e had
# stopped it before seed 67 on the first run): it prints the records seeds 13
# and 67 actually build, in a disposable checkout. The file is removed by the
# commit that adds docs/ports/rebase-verification.md.

on:
  workflow_dispatch:
  push:
    branches: [port/arm64-rebased]
    paths:
      - ".github/workflows/rebased-verify.yml"

permissions:
  contents: read

jobs:
  observed:
    name: observed seeds 13/67 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: rebased-verify-${{ matrix.arch }}
          save-if: false
      - name: Machine and commit
        run: |
          uname -m
          nproc
          git rev-parse HEAD
      - name: Observed records for seeds 13 and 67 (observation only)
        run: |
          set +e
          sed -i 's/^  "13": .*/  "13": {"faces": 0},/; s/^  "67": .*/  "67": {"faces": 0},/' tests/robustness/goldens.json
          {
            echo "# Observation run (not a pass/fail check): the expected records for seeds 13 and 67"
            echo "# were replaced in this disposable checkout so the assertion reports the observed values."
            echo "# commit $(git rev-parse HEAD), $(uname -m)"
            cargo test -p solidcraft-engine --lib "tests::robustness_goldens::seed_13" -- --nocapture 2>&1
            cargo test -p solidcraft-engine --lib "tests::robustness_goldens::seed_67" -- --nocapture 2>&1
          } | tee observed-seed-records-${{ matrix.arch }}.txt
          sha256sum tests/robustness/goldens.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observed-${{ matrix.arch }}
          path: observed-seed-records-${{ matrix.arch }}.txt
          retention-days: 7
